# SentinelOne CNS shift-left scanning for this repo (see README.md for the
# full scenario writeup and one-time setup steps this workflow depends on).
#
# This is a hand-authored analog of the workflow file the Singularity
# Operations Center normally generates for you (Policies and settings >
# Cloud Security - Integrations > CI/CD > GitHub Actions) once you create a
# service user and pick a scanner policy there - that console flow injects
# your actual policy ID into its own generated template. This file exists
# so the demo works out of the box structurally, but swap it for the
# console-generated version (or fill in the real S1_POLICY_ID repository
# variable below) before relying on it for anything beyond the demo.
name: SentinelOne CNS Shift-Left Scan

on:
  pull_request: {}

jobs:
  cns-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not just the PR merge commit) - --pull-request
          # below diffs against origin/<base_ref>, which needs real history
          # to compare against, not a shallow single-commit checkout.
          fetch-depth: 0

      - name: Fetch base and head branches
        run: |
          git fetch origin "${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install s1-cns-cli
        run: pip3 install s1-shift-left-cli

      - name: Configure s1-cns-cli
        run: |
          s1-cns-cli config \
            --service-user-api-token "${{ secrets.S1_SERVICE_USER_API_TOKEN }}" \
            --management-console-url "${{ vars.S1_MANAGEMENT_CONSOLE_URL }}" \
            --scope-type "${{ vars.S1_SCOPE_TYPE }}" \
            --scope-id "${{ vars.S1_SCOPE_ID }}" \
            --policy-id "${{ vars.S1_POLICY_ID }}"

      # continue-on-error on all three scan steps below: s1-cns-cli exits
      # non-zero whenever a scan's results trip the configured policy's exit
      # conditions (expected - the planted secrets/misconfigs/CVEs are the
      # whole point of this demo, and the low default threshold means the
      # secret scan alone will essentially always trip it). Without
      # continue-on-error, GitHub Actions stops the job at the first failing
      # step by default, so IaC and vulnerability scans would never even run.
      # Each still publishes its own results regardless of its own exit
      # code; "Check scan results" below fails the job overall afterward if
      # any of the three did.
      - name: Secret scan
        id: secret_scan
        continue-on-error: true
        run: |
          s1-cns-cli scan secret \
            -d . \
            --pull-request "origin/${{ github.head_ref }}" "origin/${{ github.base_ref }}" \
            --publish-result \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-full-name "${{ github.repository }}" \
            --provider GITHUB

      - name: IaC scan
        id: iac_scan
        continue-on-error: true
        run: |
          s1-cns-cli scan iac \
            -d infra \
            --branch "${{ github.head_ref }}" \
            --publish-result \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-full-name "${{ github.repository }}" \
            --provider GITHUB

      - name: Vulnerability scan
        id: vuln_scan
        continue-on-error: true
        run: |
          # Confirmed live: unlike iac/secret, `scan vuln` doesn't accept
          # --branch at all - passing it errors with "unrecognized arguments".
          s1-cns-cli scan vuln \
            -d app \
            --publish-result \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-full-name "${{ github.repository }}" \
            --provider GITHUB

      - name: Check scan results
        if: always()
        run: |
          echo "Secret scan:        ${{ steps.secret_scan.outcome }}"
          echo "IaC scan:           ${{ steps.iac_scan.outcome }}"
          echo "Vulnerability scan:  ${{ steps.vuln_scan.outcome }}"
          if [ "${{ steps.secret_scan.outcome }}" = "failure" ] || \
             [ "${{ steps.iac_scan.outcome }}" = "failure" ] || \
             [ "${{ steps.vuln_scan.outcome }}" = "failure" ]; then
            echo "One or more scans tripped the configured policy's exit conditions - failing this check."
            exit 1
          fi
