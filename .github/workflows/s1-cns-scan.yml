# SentinelOne CNS shift-left scanning for this repo (see README.md for the
# full scenario writeup and one-time setup steps this workflow depends on).
#
# This is a hand-authored analog of the workflow file the Singularity
# Operations Center normally generates for you (Policies and settings >
# Cloud Security - Integrations > CI/CD > GitHub Actions) once you create a
# service user and pick a scanner policy there - that console flow injects
# your actual policy ID into its own generated template. This file exists
# so the demo works out of the box structurally, but swap it for the
# console-generated version (or fill in the real S1_POLICY_ID repository
# variable below) before relying on it for anything beyond the demo.
name: SentinelOne CNS Shift-Left Scan

on:
  pull_request: {}

jobs:
  cns-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history (not just the PR merge commit) - --pull-request
          # below diffs against origin/<base_ref>, which needs real history
          # to compare against, not a shallow single-commit checkout.
          fetch-depth: 0

      - name: Fetch base and head branches
        run: |
          git fetch origin "${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install s1-cns-cli
        run: pip3 install s1-shift-left-cli

      - name: Configure s1-cns-cli
        run: |
          s1-cns-cli config \
            --service-user-api-token "${{ secrets.S1_SERVICE_USER_API_TOKEN }}" \
            --management-console-url "${{ vars.S1_MANAGEMENT_CONSOLE_URL }}" \
            --scope-type "${{ vars.S1_SCOPE_TYPE }}" \
            --scope-id "${{ vars.S1_SCOPE_ID }}" \
            --policy-id "${{ vars.S1_POLICY_ID }}"

      - name: Secret scan
        run: |
          s1-cns-cli scan secret \
            -d . \
            --pull-request "origin/${{ github.head_ref }}" "origin/${{ github.base_ref }}" \
            --publish-result \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-full-name "${{ github.repository }}" \
            --provider GITHUB

      - name: IaC scan
        run: |
          s1-cns-cli scan iac \
            -d infra \
            --branch "${{ github.head_ref }}" \
            --publish-result \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-full-name "${{ github.repository }}" \
            --provider GITHUB

      - name: Vulnerability scan
        run: |
          s1-cns-cli scan vuln \
            -d app \
            --publish-result \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-full-name "${{ github.repository }}" \
            --provider GITHUB \
            --branch "${{ github.head_ref }}"
